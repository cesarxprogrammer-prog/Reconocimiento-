<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control con la mano</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    /* Video de la cámara */
    #video {
      position: fixed;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      transform: scaleX(-1);
    }

    /* Canvas donde dibujamos la mano */
    #canvas {
      position: fixed;

      width: 100vw;
      height: 100vh;

      top: 0;
      left: 0;

      transform: scaleX(-1);

      pointer-events: none;
    }

    /* Cursor que sigue al índice */
    #cursor {
      position: fixed;

      width: 40px;
      height: 40px;

      background: red;

      border: 4px solid white;

      border-radius: 50%;

      transform: translate(-50%, -50%);

      pointer-events: none;

      display: none;

      z-index: 100;
    }

    /* Panel de información */
    #estado {
      position: fixed;

      top: 20px;
      left: 20px;

      padding: 15px 20px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      border-radius: 12px;

      font-size: 18px;

      z-index: 200;
    }

    #titulo {
      font-weight: bold;
      margin-bottom: 5px;
    }

  </style>

</head>

<body>

  <!-- Cámara -->
  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <!-- Dibujo de la mano -->
  <canvas id="canvas"></canvas>


  <!-- Cursor -->
  <div id="cursor"></div>


  <!-- Estado -->
  <div id="estado">

    <div id="titulo">
      🖐️ Reconocimiento de mano
    </div>

    <div id="mensaje">
      Iniciando cámara...
    </div>

  </div>


  <!-- ============================ -->
  <!-- LIBRERÍAS MEDIAPIPE -->
  <!-- ============================ -->

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js">
  </script>


  <script>

    // =============================
    // ELEMENTOS
    // =============================

    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const cursor =
      document.getElementById("cursor");

    const mensaje =
      document.getElementById("mensaje");


    // =============================
    // CONFIGURAR MEDIAPIPE
    // =============================

    const hands = new Hands({

      locateFile: (file) => {

        return (
          "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
          file
        );

      }

    });


    hands.setOptions({

      // Solo una mano
      maxNumHands: 1,

      // Complejidad del modelo
      modelComplexity: 1,

      // Confianza mínima para detectar
      minDetectionConfidence: 0.6,

      // Confianza mínima para seguimiento
      minTrackingConfidence: 0.6

    });


    // =============================
    // RESULTADOS
    // =============================

    hands.onResults((results) => {

      // Ajustar canvas
      canvas.width =
        video.videoWidth || window.innerWidth;

      canvas.height =
        video.videoHeight || window.innerHeight;


      // Limpiar dibujo anterior
      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // ¿Hay una mano?
      if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
      ) {

        mensaje.innerHTML =
          "✅ MANO DETECTADA";


        // Obtener primera mano
        const landmarks =
          results.multiHandLandmarks[0];


        // =============================
        // DIBUJAR ESQUELETO
        // =============================

        drawConnectors(

          ctx,

          landmarks,

          HAND_CONNECTIONS,

          {
            color: "#00FF00",
            lineWidth: 4
          }

        );


        // =============================
        // DIBUJAR LOS 21 PUNTOS
        // =============================

        drawLandmarks(

          ctx,

          landmarks,

          {
            color: "#FF0000",
            lineWidth: 2,
            radius: 4
          }

        );


        // =============================
        // PUNTA DEL ÍNDICE
        // =============================

        /*
          MediaPipe detecta 21 puntos.

          El número 8 corresponde
          a la punta del dedo índice.
        */

        const indice =
          landmarks[8];


        // =============================
        // CONVERTIR POSICIÓN
        // =============================

        /*
          MediaPipe devuelve:

          X = 0 hasta 1
          Y = 0 hasta 1

          Lo convertimos al tamaño
          de la pantalla.
        */

        const x =
          (1 - indice.x) *
          window.innerWidth;

        const y =
          indice.y *
          window.innerHeight;


        // =============================
        // MOVER CURSOR
        // =============================

        cursor.style.left =
          x + "px";

        cursor.style.top =
          y + "px";

        cursor.style.display =
          "block";


        mensaje.innerHTML =
          "✅ MANO DETECTADA" +
          "<br>" +
          "☝️ Siguiendo índice" +
          "<br>" +
          "X: " +
          Math.round(x) +
          " | Y: " +
          Math.round(y);


      } else {

        // No hay mano

        mensaje.innerHTML =
          "🔎 Buscando mano...";

        cursor.style.display =
          "none";

      }

    });



    // =============================
    // INICIAR CÁMARA
    // =============================

    const camera =
      new Camera(
        video,
        {

          onFrame: async () => {

            await hands.send({

              image: video

            });

          },

          width: 640,

          height: 480

        }
      );


    camera.start();


    // =============================
    // ERROR DE CÁMARA
    // =============================

    camera.start()
      .then(() => {

        mensaje.innerHTML =
          "🔎 Buscando mano...";

      })
      .catch((error) => {

        console.error(error);

        mensaje.innerHTML =
          "❌ Error al abrir cámara";

      });

  </script>

</body>
</html>
