<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seguimiento del dedo índice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #video {
      position: fixed;
      width: 100vw;
      height: 100vh;
      object-fit: cover;

      /* Efecto espejo */
      transform: scaleX(-1);
    }

    #cursor {
      position: fixed;

      width: 35px;
      height: 35px;

      background: red;
      border: 3px solid white;
      border-radius: 50%;

      transform: translate(-50%, -50%);

      pointer-events: none;

      display: none;

      z-index: 10;
    }

    #estado {
      position: fixed;
      top: 20px;
      left: 20px;

      background: rgba(0,0,0,.7);
      padding: 12px 18px;
      border-radius: 10px;

      z-index: 20;
    }
  </style>
</head>

<body>

  <video id="video" autoplay playsinline></video>

  <div id="cursor"></div>

  <div id="estado">
    Buscando mano...
  </div>


  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <!-- Utilidad para manejar la cámara -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


  <script>

    const video = document.getElementById("video");
    const cursor = document.getElementById("cursor");
    const estado = document.getElementById("estado");


    // Crear detector de manos
    const hands = new Hands({

      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      }

    });


    // Configuración
    hands.setOptions({

      maxNumHands: 1,

      modelComplexity: 1,

      minDetectionConfidence: 0.6,

      minTrackingConfidence: 0.6

    });


    // Cuando MediaPipe detecta una mano
    hands.onResults((results) => {

      if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
      ) {

        const mano = results.multiHandLandmarks[0];


        // Punto número 8:
        // punta del dedo índice
        const indice = mano[8];


        /*
          MediaPipe devuelve coordenadas entre 0 y 1.

          indice.x
          indice.y

          Las convertimos al tamaño de la pantalla.
        */


        // Invertimos X porque la cámara está en espejo
        const x = (1 - indice.x) * window.innerWidth;

        const y = indice.y * window.innerHeight;


        // Mover cursor
        cursor.style.left = x + "px";

        cursor.style.top = y + "px";

        cursor.style.display = "block";


        estado.innerHTML =
          "☝️ Índice detectado<br>" +
          "X: " + Math.round(x) +
          " Y: " + Math.round(y);

      }

      else {

        cursor.style.display = "none";

        estado.innerHTML = "Buscando mano...";

      }

    });



    // Iniciar cámara
    const camera = new Camera(video, {

      onFrame: async () => {

        await hands.send({
          image: video
        });

      },

      width: 640,

      height: 480

    });


    camera.start();

  </script>

</body>
</html>
