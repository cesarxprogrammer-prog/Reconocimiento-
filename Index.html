<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba cámara</title>
</head>

<body style="background:#111;color:white;font-family:Arial">

  <h2>Prueba de cámara</h2>

  <button onclick="iniciarCamara()">
    ACTIVAR CÁMARA
  </button>

  <p id="estado"></p>

  <video
    id="video"
    autoplay
    playsinline
    muted
    style="width:100%;max-width:600px">
  </video>

  <script>
    async function iniciarCamara() {

      const video = document.getElementById("video");
      const estado = document.getElementById("estado");

      try {

        estado.textContent = "Solicitando cámara...";

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });

        video.srcObject = stream;

        estado.textContent = "✅ Cámara funcionando";

      } catch (error) {

        estado.innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +
          "Error: " + error.name + "<br>" +
          error.message;

        console.error(error);
      }
    }
  </script>

</body>
</html>
